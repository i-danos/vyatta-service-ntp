# /etc/chrony/chrony.conf, configuration for chronyd; see chrony.conf(5).

# This configuration file is automatically generated by the Vyatta
# configuration subsystem.  Please do not manually edit it.
#
# The first section of this file consists of static parameters
# that can not be changed via the Vyatta configuration subsystem.
#

driftfile /var/lib/chrony/chrony.drift

# This is a client-only configuration: chronyd does not serve time and does
# not open the NTP port. chronyd is a client by default -- it only listens
# when "allow" is given -- so nothing needs to be denied explicitly, unlike
# ntpd which required "restrict default ignore noquery".

# Local users may interrogate the daemon over the command socket, which is
# restricted to root and the _chrony user by file permissions. Deny command
# access over the network.
cmddeny all

# Step the clock rather than slewing it if the offset is large, but only
# during the first few updates, so that a badly wrong clock is corrected
# quickly at boot without jumping the clock during normal operation.
makestep 1.0 3

# Let chronyd use the RTC to help discipline the clock across reboots.
rtcsync

#
# The remainder of this file is for parameters that are set up via
# the Vyatta configuration subsystem.
#
